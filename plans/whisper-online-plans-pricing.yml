  Whisper publishes no priced tiers. The FAQ says "Every account starts free ... See the pricing page for what
  each plan includes", but /pricing on whisper.security redirects to the homepage and no tier names or prices
  appear anywhere on whisper.online, whisper.security, the llms.txt files or the docs. What is published is the
  shape: a free tier ("A free tier is available, subject to fair-use limits such as caps on the number of
  Agents, requests, or traffic that we may adjust with notice", terms §7), paid plans "charged as stated at
  purchase or in a written order", fees exclusive of taxes, and price changes with at least 30 days' notice
  effective at the next renewal. The programmatic signup returns plan: "free" (agent-signup docs) or "trial"
  (llms.txt example), and the console's Billing page "carries your plan, usage quota, and payment details".
