limit_count: 6
summary: >-
  Published limits are numeric where they concern the free trial and structural elsewhere. There is "no per-op
  rate limit beyond the shared API gate"; exhaustion is signalled as HTTP 429 — as RFC 7807 problem type
  query-quota-exceeded on raw Cypher, and as an envelope row with retry_after seconds on whisper.agents —
  with no rate-limit response headers documented or observed. Quota is readable at run time with
  CALL whisper.quota() and the MCP resource whisper://quota.
rate_limits:
