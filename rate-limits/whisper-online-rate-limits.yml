  scope: per-api-key (trial)
  limit: 10
  window: 1 minute
  metric: request
  source: 'agent-onboarding.json trial_limits.req_per_min; llms.txt "Trial limits: 10 requests/minute, 500/day"'
- name: Trial daily quota
  scope: per-api-key (trial)
  limit: 500
