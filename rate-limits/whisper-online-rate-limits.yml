  source: agent-onboarding.json trial_limits.req_per_day
- name: Keyless row ceiling
  scope: per-request (anonymous)
  limit: 100
  window: per query
  metric: rows returned
  source: 'docs/graph-api: "bounded by the graph''s keyless ceiling of 100 rows per query; your key lifts that ceiling"'
