  - type: Documentation
    url: https://whisper.online/docs/a2a-trust
- aid: whisper-online:whisper-rdap
  name: Whisper RDAP and Identity Verification
  description: >-
    RFC 9083 Registration Data Access Protocol for agent identities (application/rdap+json, rdapConformance
    rdap_level_0) at https://rdap.whisper.online/ip/{address}, with /help, a per-agent /transparency arm carrying
    issuance events and inclusion proofs, and the keyless full-chain verdict at /verify-identity/{address}
    (is_whisper_agent, dane_ok, jws_ok and the evidence). The same record answers over WHOIS (RFC 3912) at
    whois.whisper.online and FINGER; registry rules and the data licence are at nic.whisper.online. Verified live
    against the published first resident on 2026-09-19.
  humanURL: https://whisper.online/docs/rdap
  baseURL: https://rdap.whisper.online
  image: https://whisper.online/logo.png
