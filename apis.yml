- aid: whisper-online:whispergraph-control-plane
  name: WhisperGraph and Control Plane (Cypher API)
  description: >-
    The documented front door for both halves of the platform: POST https://graph.whisper.online/api/query runs
    openCypher against WhisperGraph (41 node labels, 52 edge types; identify, assess, explain, walk, origins,
    history, variants, the psl.* family, named views attackSurface / blastRadius / brandPhishingFleet, and raw
    read-only MATCH — keyless, capped at 100 rows) and, with X-API-Key, the one control verb CALL
    whisper.agents({op, args}) for register, identity, list, agent, connect, policy, logs and revoke. Errors are
    RFC 7807 application/problem+json with stable type slugs; the whisper.agents envelope carries ok/status/error/
    retry_after. graph.whisper.security is the legacy host with the same three endpoints (POST and GET /api/query,
    GET /api/query/stats).
  humanURL: https://whisper.online/docs/control-plane
  baseURL: https://graph.whisper.online
