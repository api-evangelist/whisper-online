- aid: whisper-online:whisper-a2a-agent
  name: Whisper A2A Agent
  description: >-
    Agent2Agent surface: an A2A 1.0-shaped card at https://whisper.online/.well-known/agent-card.json (version
    0.219.2, provider Whisper Security, JSONRPC binding, capabilities object, 37 skills — 15 keyless cognition
    and signup skills, 22 key-gated skills including every whisper.agents control-plane op) and a legacy
    0.3.0-shaped twin at /.well-known/agent.json, both served on six hosts. The JSON-RPC 2.0 endpoint
    https://whisper.online/a2a answers GET with -32600 pointing back at the card; skills are a binding over the
    same Cypher call the REST endpoint runs.
  humanURL: https://whisper.online/docs/a2a-trust
  baseURL: https://whisper.online/a2a
  image: https://whisper.online/logo.png
