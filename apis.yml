- aid: whisper-online:whispergraph-mcp-server
  name: WhisperGraph MCP Server
  description: >-
    Hosted remote MCP server at https://mcp.whisper.security (Streamable HTTP, protocol revisions up to
    2025-11-25) advertising seven read-only tools (query, explain_indicator, explain_schema, read_docs,
    list_workflows, run_workflow, identify), four resources and ten prompts, listed in the Claude Connectors
    Directory and the MCP registry. An RFC 9728 protected resource: an anonymous tools/list returns 401 with a
    WWW-Authenticate challenge naming /.well-known/oauth-protected-resource; OAuth 2.1 with RFC 7591 dynamic
    client registration and PKCE S256 (scopes mcp:read, offline_access) or a static bearer key. A stdio sibling
    ships inside the whisper CLI (whisper mcp; io.github.whisper-sec/whisper) adding keyless whisper_verify and
    whisper_rdap plus the key-gated control-plane tools.
  humanURL: https://www.whisper.security/docs/ai/mcp/setup
  baseURL: https://mcp.whisper.security
