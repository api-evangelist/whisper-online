apis:
- aid: whisper-online:whisper-api
  name: Whisper API
  description: >-
    The keyless half of the platform as an OpenAPI 3.1.0 contract (info.version 1.1.0, 13 operations, served at
    https://whisper.online/openapi.json and byte-identically on agents. and endpoint.whisper.online): the single
    Cypher endpoint POST /api/query (keyless graph reads; with X-API-Key the whole control plane via CALL
    whisper.agents), the A2A JSON-RPC endpoint POST /a2a, GET /verify-identity, the RFC 6962 transparency ledger
    (checkpoint, key, status-list, OpenTimestamps anchor, tiles, inclusion and consistency proofs), the live
    service catalogue GET /menu, and the two discovery documents. The spec deliberately excludes surfaces another
    standard already specifies (DoH, RDAP, geofeed, security.txt, SSF, SCITT, the agent card, MCP) and points at
    those standards instead.
  humanURL: https://whisper.online/docs
