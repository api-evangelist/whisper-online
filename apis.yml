aid: whisper-online
name: Whisper Security
description: >-
  Whisper Security (viaGraph B.V., Amsterdam; AS219419) gives AI agents a real, routable IPv6 /128 address as
  their identity — allocated from its own 2a04:2a01::/32, published in reverse DNS, RDAP/WHOIS and an RFC 6962
  transparency log, and DANE-pinned in DNSSEC-signed DNS so anyone can verify an agent with dig, whois and curl
  and no Whisper account. One Cypher endpoint (POST /api/query) carries both the keyless WhisperGraph — an
  internet-infrastructure and threat-intelligence graph answering who runs a host and whether it is safe, with
  the evidence chain — and the keyed control plane CALL whisper.agents (register, connect, policy, logs, revoke).
  The same surface is published as an OpenAPI 3.1 contract, an A2A 1.0 agent card with 37 skills, a hosted OAuth
  MCP server, a stdio MCP server inside the MIT whisper CLI, npm/PyPI SDKs, and llms.txt.
