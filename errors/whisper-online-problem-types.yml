non_errors_worth_knowing:
- 'An unrecognised API key on the graph REST endpoint does NOT fail the request: it runs with reduced access and answers 200. Confirm with CALL whisper.quota() (isAnonymous must be false). The MCP connector rejects the same key with 401.'
- 'explain() and whisper.history() return available:false with retryAfter in the body when the threat-intel backend is briefly unavailable; the HTTP request still succeeds.'
- 'A batch of ;-separated statements answers 200 as a whole; check each results[].success / outcome (OK, PARSE_ERROR, EXECUTION_ERROR, DEADLINE_EXCEEDED).'
- 'A successful response may carry advisories[] (null-pagination-param, skip-past-cardinality, schema-drift-rewrite, vdp-plane-empty, ...) — non-fatal notes to branch on by kind.'
