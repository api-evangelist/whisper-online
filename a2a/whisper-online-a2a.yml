agent_card:
  name: Whisper
  description: Give an AI agent a stable, routable IPv6 address of its own and egress that anyone can verify from
    outside. Use this when you need a fixed IP your traffic actually leaves from, an identity another service can
    check independently by reverse DNS and RDAP rather than taking your word for it, or control over what an agent
    is allowed to reach and a record of what it did. It also answers security questions about any domain, address
    or file hash from the Whisper graph, with no account at all. The address space is AS219419, which we run; an
    email address alone is enough to get a key.
  version: 0.219.2
  documentation_url: https://whisper.online/llms-full.txt
  icon_url: https://whisper.online/logo.png
  provider:
    organization: Whisper Security
    url: https://whisper.online
  supported_interfaces:
  - url: https://whisper.online/a2a
    protocolBinding: JSONRPC
    protocolVersion: '1.0'
  capabilities:
    streaming: false
    pushNotifications: false
    extendedAgentCard: false
  default_input_modes:
  - text/plain
  - application/json
  default_output_modes:
  - application/json
  - text/plain
  security_schemes:
    whisperApiKey:
      apiKeySecurityScheme:
        description: Your Whisper API key. Obtain one with the keyless "signup" skill.
        location: header
        name: X-API-Key
  skills_count: 37
