surface_relationship:
  note: 'The A2A card is a full projection of the platform: its 37 skills are the 16 graph/cognition verbs plus
    the 21 whisper.agents ops that the CLI, SDKs, n8n node and local MCP server also wrap (mcp/whisper-online-tool-crosswalk.yml).
    The hosted MCP server (mcp.whisper.security) is the narrower surface — 7 read-only graph tools, no control plane.
    The A2A endpoint https://whisper.online/a2a is declared in the OpenAPI as operation a2aSendMessage.'
