generated: '2026-09-19'
method: probed
source: >-
  Live probes on 2026-09-19 of whisper.online, rdap.whisper.online, graph.whisper.online, mcp.whisper.security,
  whois.whisper.online (TCP 43) and DNS (1.1.1.1 with +dnssec), cross-checked against the OpenAPI
  info.description standards table (openapi/whisper-online-openapi.json), the compliance coverage map at
  https://whisper.online/docs/compliance and the privacy policy. Each entry says whether the claim was
  verified by a fetch or only read in the docs.
standards:
- id: rfc9116-security-txt
  conforms: true
  verified: true
  evidence: 'GET https://whisper.online/.well-known/security.txt -> 200 text/plain, PGP-signed, Contact/Encryption/Policy/Acknowledgments/Canonical/Expires 2027-09-17; separate files on mcp.whisper.security, www.whisper.security and as219419.net.'
- id: rfc8414-oauth-authorization-server-metadata
  conforms: true
  verified: true
  evidence: 'GET https://mcp.whisper.security/.well-known/oauth-authorization-server -> 200 application/json (issuer, authorization/token/registration/revocation endpoints, scopes_supported, code_challenge_methods_supported [S256]).'
- id: rfc9728-oauth-protected-resource
  conforms: true
  verified: true
  evidence: 'GET https://mcp.whisper.security/.well-known/oauth-protected-resource -> 200 (resource, authorization_servers, scopes_supported, bearer_methods_supported [header]); the 401 challenge names it in WWW-Authenticate resource_metadata.'
- id: oauth2-authorization-code-pkce
  conforms: true
  verified: true
  evidence: 'grant_types_supported [authorization_code, refresh_token], code_challenge_methods_supported [S256], token_endpoint_auth_methods_supported [none] in the RFC 8414 document; docs state PKCE S256 and public clients.'
- id: rfc7591-dynamic-client-registration
  conforms: true
  verified: true
  evidence: 'registration_endpoint https://mcp.whisper.security/oauth/register in the RFC 8414 document; client_id_metadata_document_supported true.'
- id: oidc
  conforms: false
  verified: true
  evidence: '/.well-known/openid-configuration -> 404 on whisper.online, www.whisper.online, mcp.whisper.security; 403 on graph/rdap; the console host redirects every path to a sign-in page. Sign-in is delegated to Clerk (privacy policy), not exposed as an OIDC provider.'
- id: rfc9457-problem-details
  conforms: true
  verified: true
  evidence: 'POST https://graph.whisper.online/api/query with malformed Cypher -> 400 application/problem+json {type https://whisper.security/errors/query-error, title, status, detail, instance, timestamp, suggestions[]} (the docs cite RFC 7807; the shape is the same as RFC 9457). whisper.agents envelope errors and JSON-RPC errors are separate shapes.'
- id: a2a-1.0
  conforms: true
  verified: true
  evidence: 'GET https://whisper.online/.well-known/agent-card.json -> 200 application/json, 1.0-shaped card (supportedInterfaces[].protocolVersion "1.0", protocolBinding JSONRPC, capabilities object, 37 skills); a 0.3.0-shaped twin at /.well-known/agent.json; GET /a2a -> 400 JSON-RPC -32600 naming the card. Graded in a2a/whisper-online-a2a.yml.'
- id: mcp
  conforms: true
  verified: true
  evidence: 'https://mcp.whisper.security answers MCP over Streamable HTTP behind OAuth (401 with RFC 9728 challenge on tools/list and initialize); /.well-known/mcp.json and /.well-known/mcp-manifest.json -> 200; MCP registry entries io.github.whisper-sec/whisper-graph (remote) and io.github.whisper-sec/whisper (stdio, OCI).'
- id: json-rpc-2.0
  conforms: true
  verified: true
  evidence: 'GET https://whisper.online/a2a -> {"jsonrpc":"2.0","id":null,"error":{"code":-32600,...}}; the MCP server and the local whisper mcp are JSON-RPC 2.0 per the docs.'
- id: rdap-rfc9083
  conforms: true
  verified: true
  evidence: 'GET https://rdap.whisper.online/ip/2a04:2a01:b69a:6717:e3b0:51ff:3bf7:f478 -> 200 application/rdap+json, rdapConformance [rdap_level_0], objectClassName "ip network", entities/events/links; /help and / return RDAP notices.'
